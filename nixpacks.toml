[phases.setup]
nixPkgs = ["...", "php83", "php83Extensions.intl", "php83Extensions.gd", "php83Extensions.zip", "php83Extensions.bcmath", "php83Extensions.pdo_pgsql"]

[phases.build]
dependsOn = ["setup"]
cmds = [
    "mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs storage/app bootstrap/cache",
    "composer install --optimize-autoloader --no-dev --no-scripts",
    "composer dump-autoload --optimize",
    "npm install && npm run build",
    "chmod +x start.sh"
]

[start]
cmd = "bash start.sh"
