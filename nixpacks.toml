[phases.setup]
nixPkgs = ["...", "php83", "php83Extensions.intl", "php83Extensions.gd", "php83Extensions.zip", "php83Extensions.bcmath", "php83Extensions.pdo_pgsql"]

[phases.build]
dependsOn = ["setup"]
cmds = ["composer install --optimize-autoloader --no-dev", "npm install && npm run build"]

[phases.deploy]
dependsOn = ["build"]
cmds = ["php artisan migrate --force", "php artisan optimize", "php artisan serve --host 0.0.0.0 --port $PORT"]
