name: sirekap

services:

  db:
    image: postgres:15
    container_name: sirekap_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mcc_rekap}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - sirekap_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: sirekap_app
    restart: unless-stopped
    ports:
      - "8008:80"
    depends_on:
      - db
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8008}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-mcc_rekap}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_ENCRYPT: "true"
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai_service:8001/api/predict-sdgs}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}

  ai_service:
    build:
      context: ../mcc-python-ai
      dockerfile: Dockerfile
    container_name: sirekap_ai
    restart: unless-stopped
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  sirekap_pgdata:

